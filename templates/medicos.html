{% extends 'base.html' %}

{% block content %}
<h1>LISTA DE MEDICOS</h1>
<table class="table table-striped table-hover">
    <thead class ="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Especialidad</th>
            <th>Telefono</th>
        </tr>
    </thead>
    <tbody>
        {% for medico in medicos %}
        <tr>
            <td>{{ medico.id_medico }}</td>
            <td>{{ medico.nombre }}</td>
            <td>{{ medico.especialidad }}</td>
            <td>{{ medico.telefono }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
