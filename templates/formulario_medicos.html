{% extends "base.html" %}

{% block content %} 

<div class="card">
    <div class ="card-header">
        <h2>
            {% if medico %}
            Editar Médico
            {% else %}
            Nuevo Médico
            {% endif %}
        </h2>
    </div>
    <div class="card-body">
        <form action="" method="post">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" class="form-control" name="nombre" 
                value="{{ medico.nombre if medico else '' }}" required>
            </div>
            <div class="mb-3">
                <label for="especialidad" class="form-label">Especialidad:</label>
                <input type="text" class="form-control" id="especialidad" name="especialidad" 
                value="{{ medico.especialidad if medico else '' }}" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" class="form-control" id="email" name="email" 
                value="{{ medico.email if medico else '' }}" required>
            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono:</label>
                <input type="tel" class="form-control" id="telefono" name="telefono" 
                value="{{ medico.telefono if medico else '' }}" required>
            </div>
            <button type="submit" class="btn btn-primary">Guardar Médico</button>
        </form>
    </div>
</div>
{% endblock %}
